
<div fxLayout="row" style="padding-bottom: 25px">
    <mat-label>Customer Registration</mat-label>
</div>

<form #clientForm="ngForm" (ngSubmit)="onSave()">
<div>
    <mat-form-field class="example-full-width" appearance="fill">
    <mat-label>First Name</mat-label>
    <input matInput placeholder="First Name" name="firstName" [(ngModel)]="firstName" required>
    <mat-error>First Name is required</mat-error>
    </mat-form-field>

    <mat-form-field class="example-full-width" appearance="fill">
    <mat-label>Last Name</mat-label>
    <input matInput placeholder="Last Name" name="lastName" [(ngModel)]="lastName" required>
    <mat-error>Last Name is required</mat-error>
    </mat-form-field>

    <mat-form-field class="example-full-width" appearance="fill">
    <mat-label>Phone</mat-label>
        <input matInput placeholder="Phone" name="phone" [(ngModel)]="phone" required>
        <mat-error>Phone is required</mat-error>
    </mat-form-field>

    <mat-form-field class="example-full-width" appearance="fill">
    <mat-label>Email</mat-label>
        <input matInput placeholder="Email" name="email" [(ngModel)]="email" required>
        <mat-error>Email is required</mat-error>
    </mat-form-field>
</div>

<div fxLayout="row" fxLayoutAlign="end center">
    <button mat-raised-button color="primary" type="submit" [disabled]="clientForm.invalid">Save</button>
</div>
</form>

<div fxLayout="row" style="padding-top: 40px">
    <mat-table matTableResponsive [dataSource]="dataSource" #table fxFill="100">
        <ng-container matColumnDef="id">
            <mat-header-cell *matHeaderCellDef> Id </mat-header-cell>
            <mat-cell *matCellDef="let element"> {{element.id}} </mat-cell>
        </ng-container>

        <ng-container matColumnDef="firstName">
        <mat-header-cell *matHeaderCellDef>First Name</mat-header-cell>
        <mat-cell *matCellDef="let element"> {{element.firstName}} </mat-cell>
        </ng-container>

        <ng-container matColumnDef="lastName">
        <mat-header-cell *matHeaderCellDef>Last Name</mat-header-cell>
        <mat-cell *matCellDef="let element"> {{element.lastName}} </mat-cell>
        </ng-container>

        <ng-container matColumnDef="phone">
        <mat-header-cell *matHeaderCellDef>Phone</mat-header-cell>
        <mat-cell *matCellDef="let element"> {{element.phone}} </mat-cell>
        </ng-container>

        <ng-container matColumnDef="actions">
            <mat-header-cell *matHeaderCellDef mat-sort-header></mat-header-cell>
            <mat-cell *matCellDef="let element">
              <div class="button">
                <button mat-button><i class="fa fa-delete" *ngIf="element.id"></i> Delete </button>
              </div>
            </mat-cell >
        </ng-container>

        <mat-header-row *matHeaderRowDef="displayedColumns; sticky:true"></mat-header-row>
        <mat-row  *matRowDef="let row; columns: displayedColumns;"></mat-row>
    </mat-table>
</div>
