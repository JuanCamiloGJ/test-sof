server.port=8080
spring.application.name=TestApplication

# ---------------------------------------------------------------------------
# Swagger UI / OpenAPI docs
# Swagger UI: http://localhost:8080/swagger-ui.html
# OpenAPI JSON: http://localhost:8080/v3/api-docs
# ---------------------------------------------------------------------------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ---------------------------------------------------------------------------
# B1 - Database manager change: SQL Server Express -> H2 (in-memory)
# Changes applied: driver dependency in pom.xml, connection string below,
# and schema.sql for object creation (Hibernate dialect is auto-detected).
# ---------------------------------------------------------------------------
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:exam;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# The data access layer is JdbcTemplate-based; Hibernate is only on the
# classpath (spring-boot-starter-data-jpa), so no entities are managed.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.sql.init.mode=always
